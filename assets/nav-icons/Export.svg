<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">

  <g fill="#FFFFFF">

    <!-- Tray (U-shape) -->
    <rect x="14" y="34" width="6" height="20" rx="3" ry="3"/>
    <rect x="44" y="34" width="6" height="20" rx="3" ry="3"/>
    <rect x="14" y="48" width="36" height="6"  rx="3" ry="3"/>

    <!-- Arrow (up then right) -->
    <!-- vertical stem -->
    <rect x="29" y="16" width="6" height="22" rx="3" ry="3"/>
    <!-- horizontal arm (extended a bit so it overlaps the arrowhead base) -->
    <rect x="32" y="16" width="22" height="6" rx="3" ry="3"/>
    <!-- Larger arrowhead for small-size legibility -->
    <polygon points="60,19 48,11 48,27"/>

  </g>

</svg>
