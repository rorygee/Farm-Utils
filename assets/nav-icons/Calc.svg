<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">

  <g fill="#FFFFFF">

    <!-- PLUS (center x=16, center y=32) -->
    <!-- horizontal (24x8) -->
    <rect x="4" y="28" width="24" height="8"/>
    <!-- vertical (8x24) -->
    <rect x="12" y="20" width="8" height="24"/>

    <!-- MULTIPLY (center x=48, center y=32) -->
    <rect x="44" y="18" width="8" height="28"
          transform="rotate(45 48 32)"/>
    <rect x="44" y="18" width="8" height="28"
          transform="rotate(-45 48 32)"/>

  </g>

</svg>
