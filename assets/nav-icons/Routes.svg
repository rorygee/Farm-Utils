<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">

  <!-- Edges (thinner for small-size legibility) -->
  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <line x1="20" y1="44" x2="32" y2="20"/>
    <line x1="44" y1="44" x2="32" y2="20"/>

  </g>

  <!-- Nodes -->
  <g fill="#FFFFFF">
    <circle cx="20" cy="44" r="8"/>
    <circle cx="44" cy="44" r="8"/>
    <circle cx="32" cy="20" r="8"/>
  </g>

</svg>
